<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="css/estilo.css">
    <title>NewStile- Acceso</title>
  </head>
  <body>

    <h1>newstile</h1>

    <h2>El closet que se adapta a ti</h2>

    <p id="parrafo_1">Crea conjuntos de ropa, guarda tus favoritos y descubre nuevas formas de usar lo que ya tienes.</p>

    <p class="destacado">Tu estilo, tu historia ♡</p>

    <h2>Acceso a Newstile</h2>

    <form id="login_form">
      <label for="usuario">Usuario</label>
      <br><br>
      <input type="text" id="usuario" name="usuario" placeholder="Usuario">
      <br><br>

      <label for="contrasena">Contraseña</label>
      <br><br>
      <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña">
      <br><br>

      <div class="olvidaste">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <br>

      <button id="mi_boton">Iniciar sesión</button>
    </form>

    <br>
    <p id="parrafo_2">¿No tienes cuenta? <a href="#">Registrarse</a></p>

    <script src="js/ejemplo.js"></script>

  </body>
</html>
